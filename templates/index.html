<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Зээлийн үнэлгээ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      width: 100%;
      max-width: 520px;
      padding: 40px;
    }

    h1 {
      font-size: 1.5rem;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: .875rem;
      color: #718096;
      margin-bottom: 32px;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: .875rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      color: #2d3748;
      outline: none;
      transition: border-color .2s;
    }

    input:focus, select:focus { border-color: #4299e1; }

    .hint {
      font-size: .75rem;
      color: #a0aec0;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: 8px;
    }

    button:hover { background: #3182ce; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }

    #result {
      margin-top: 28px;
      padding: 20px;
      border-radius: 12px;
      display: none;
    }

    #result.green  { background: #f0fff4; border: 1.5px solid #68d391; }
    #result.orange { background: #fffaf0; border: 1.5px solid #f6ad55; }
    #result.red    { background: #fff5f5; border: 1.5px solid #fc8181; }

    .result-label {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .green  .result-label { color: #276749; }
    .orange .result-label { color: #7b341e; }
    .red    .result-label { color: #9b2c2c; }

    .prob-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: .85rem;
    }

    .prob-name { width: 180px; color: #4a5568; flex-shrink: 0; }

    .prob-bar-wrap {
      flex: 1;
      background: #e2e8f0;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .prob-bar {
      height: 100%;
      border-radius: 99px;
      background: #4299e1;
      transition: width .5s ease;
    }

    .prob-pct { width: 42px; text-align: right; color: #718096; }

    #error-msg {
      margin-top: 16px;
      padding: 12px 16px;
      background: #fff5f5;
      border: 1.5px solid #fc8181;
      border-radius: 8px;
      color: #c53030;
      font-size: .875rem;
      display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Зээлийн үнэлгээ</h1>
  <p class="subtitle">Зээлийн хүсэлтийг Gradient Boosting загвараар үнэлнэ</p>

  <form id="loanForm">
    <div class="field">
      <label for="monthly_income">Сарын орлого (₮)</label>
      <input type="number" id="monthly_income" name="monthly_income"
             placeholder="Жишээ: 1500000" min="1" required />
    </div>

    <div class="field">
      <label for="employment_years">Ажилласан жил</label>
      <input type="number" id="employment_years" name="employment_years"
             placeholder="Жишээ: 3" min="0" step="0.5" required />
    </div>

    <div class="field">
      <label for="requested_amount">Зээлийн хэмжээ (₮)</label>
      <input type="number" id="requested_amount" name="requested_amount"
             placeholder="Жишээ: 5000000" min="1" required />
      <p class="hint" id="ratio-hint"></p>
    </div>

    <div class="field">
      <label for="employment_type">Ажил мэргэжил</label>
      <select id="employment_type" name="employment_type" required>
        <option value="" disabled selected>Сонгоно уу</option>
        {% for et in employment_types %}
        <option value="{{ et }}">{{ et }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" id="submitBtn">Үнэлэх</button>
  </form>

  <div id="error-msg"></div>

  <div id="result">
    <div class="result-label" id="result-label"></div>
    <div id="prob-bars"></div>
  </div>
</div>

<script>
  const PROB_NAMES = {
    approved:      "Зөвшөөрөгдсөн",
    manual_review: "Гараар шалгах",
    rejected:      "Татгалзагдсан",
  };

  const incomeEl = document.getElementById("monthly_income");
  const amountEl = document.getElementById("requested_amount");
  const hintEl   = document.getElementById("ratio-hint");

  function updateHint() {
    const inc = parseFloat(incomeEl.value);
    const amt = parseFloat(amountEl.value);
    if (inc > 0 && amt > 0) {
      const ratio = (amt / inc).toFixed(1);
      const dti   = ((amt / (inc * 12)) * 100).toFixed(1);
      hintEl.textContent = `Орлогын харьцаа: ${ratio}x  |  Жилийн DTI: ${dti}%`;
    } else {
      hintEl.textContent = "";
    }
  }

  incomeEl.addEventListener("input", updateHint);
  amountEl.addEventListener("input", updateHint);

  document.getElementById("loanForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const resultEl = document.getElementById("result");
    const errorEl  = document.getElementById("error-msg");

    btn.disabled = true;
    btn.textContent = "Үнэлж байна...";
    resultEl.style.display = "none";
    errorEl.style.display  = "none";

    const formData = new FormData(e.target);

    try {
      const res  = await fetch("/predict", { method: "POST", body: formData });
      const data = await res.json();

      if (data.error) {
        errorEl.textContent    = data.error;
        errorEl.style.display  = "block";
      } else {
        resultEl.className     = "result-" + "" + data.color;
        resultEl.classList.add(data.color);
        document.getElementById("result-label").textContent = data.label;

        const barsEl = document.getElementById("prob-bars");
        barsEl.innerHTML = "";
        for (const [key, pct] of Object.entries(data.probabilities)) {
          barsEl.innerHTML += `
            <div class="prob-row">
              <span class="prob-name">${PROB_NAMES[key] || key}</span>
              <div class="prob-bar-wrap">
                <div class="prob-bar" style="width:${pct}%"></div>
              </div>
              <span class="prob-pct">${pct}%</span>
            </div>`;
        }

        resultEl.style.display = "block";
      }
    } catch {
      errorEl.textContent   = "Сервертэй холбогдоход алдаа гарлаа.";
      errorEl.style.display = "block";
    } finally {
      btn.disabled     = false;
      btn.textContent  = "Үнэлэх";
    }
  });
</script>
</body>
</html>
